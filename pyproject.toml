[project]
name = "soundpad"
version = "0.1.0"
description = "Launchpad originale (NOVLPD01) come spia degli hook di Claude Code"
requires-python = ">=3.11"
dependencies = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
]

[project.scripts]
soundpad = "soundpad.daemon:main"
soundpad-hooks = "soundpad.install_hooks:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
