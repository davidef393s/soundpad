[project]
name = "soundpad"
version = "0.1.0"
description = "Launchpad originale (NOVLPD01) come spia degli hook di Claude Code"
requires-python = ">=3.11"
dependencies = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
]

[project.optional-dependencies]
# Finestra e icona nell'area di notifica: uv run --extra app soundpad-app
app = [
    "pywebview>=5",
    "pystray>=0.19",
    "pillow>=10",
]

[dependency-groups]
# Solo per costruire soundpad.exe (build.py)
build = ["pyinstaller>=6"]

[project.scripts]
soundpad = "soundpad.daemon:main"
soundpad-hooks = "soundpad.install_hooks:main"

[project.gui-scripts]
soundpad-app = "soundpad.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
